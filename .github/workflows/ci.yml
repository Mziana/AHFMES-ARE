name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # P1-11: install requirements penuh (ci.yml lama hanya install polars,
      # padahal smoke test menjalankan are.cli yang meng-import pyyaml, dan
      # are/__init__ menarik pandas; data_collectors butuh requests saat
      # menyentuh jalur terkait). Sinkron dgn requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest tests/are/ -k "backtest or enhanced or cpcv" -q --tb=short
      - name: Smoke test backtest
        run: bash TOOLS/smoke_test_backtest.sh
